name: POLYFLOAT MacOS Tests
on:
  workflow_call:

jobs:
  macos:
    name: ${{ matrix.compiler.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "clang"       , preset: "clang-macos"        }
          - { name: "clang libc++", preset: "clang-macos-libc++" }

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      ##==========================================================================================
      ## MPFR C++ is a single header fetched next to the sources, and the presets read the two
      ## brew prefixes from the environment since they are only known at run time.
      ##==========================================================================================
      - name: Install MPFR C++
        run: curl -sSLO https://raw.githubusercontent.com/advanpix/mpreal/master/mpreal.h

      - name: Locate GMP and MPFR
        run: |
          echo "GMP_PREFIX=$(brew --prefix gmp)"   >> "$GITHUB_ENV"
          echo "MPFR_PREFIX=$(brew --prefix mpfr)" >> "$GITHUB_ENV"

      - name: Configure CMake and Build
        uses: jfalcou/copacabana/.github/actions/config@3337f916bb581d0829909976773f7a2ee827a25c # v4
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: doc.exe unit.exe

      - name: Run Doc Tests
        uses: jfalcou/copacabana/.github/actions/test@3337f916bb581d0829909976773f7a2ee827a25c # v4
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: ^doc.*

      - name: Run Unit Tests
        uses: jfalcou/copacabana/.github/actions/test@3337f916bb581d0829909976773f7a2ee827a25c # v4
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: ^unit.*
