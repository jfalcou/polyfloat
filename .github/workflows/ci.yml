name: Unit Tests
on:
  pull_request:
    branches:
      - main

concurrency:
  group: polyfloat-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Meta Checks
    uses: jfalcou/copacabana/.github/workflows/precommit.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6

  sanitizer-tests:
    name: Sanitizers
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      build-targets: doc.exe unit.exe
      test-targets: doc|unit

  coverage-report:
    name: Coverage
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      project: polyfloat
      build-targets: polyfloat-test

  linux-tests:
    name: Linux
    needs: [precommit, sanitizer-tests]
    uses: ./.github/workflows/linux.yml

  macos-tests:
    name: MacOS
    needs: [precommit, sanitizer-tests]
    uses: ./.github/workflows/macos.yml
