name: Unit Tests
on:
  ## Main gets the matrix once a night rather than on every merge: a run of its own queued behind each merge held
  ## the pull requests back. 02:50 UTC, one rung of the fleet's 45 minute ladder, which starts at 00:35 and
  ## never lands on the hour every other scheduled workflow on the platform asks for. kyosu opens it and polyfloat
  ## sits in its middle, the two heaviest matrices taking the emptiest slots.
  schedule:
    - cron: '50 2 * * *'
  pull_request:
    branches:
      - main

concurrency:
  group: polyfloat-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Meta Checks
    uses: jfalcou/copacabana/.github/workflows/precommit.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8

  sanitizer-tests:
    name: Sanitizers
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      build-targets: doc.exe unit.exe
      test-targets: doc|unit

  coverage-report:
    name: Coverage
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      project: polyfloat
      build-targets: polyfloat-test

  linux-tests:
    name: Linux
    needs: [precommit, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/linux.yml

  ## Reported and not required: see the matrix file for why it builds without the precompiled header.
  no-pch-tests:
    name: Linux
    needs: [precommit, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/linux-no-pch.yml

  macos-tests:
    name: MacOS
    needs: [precommit, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/macos.yml
