name: POLYFLOAT Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: polyfloat-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      project: polyfloat
      cxx-compiler: g++-15
