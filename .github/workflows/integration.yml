name: POLYFLOAT - Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ##################################################################################################
  ## Check install process of POLYFLOAT via CMake
  ##################################################################################################
  install:
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    strategy:
      fail-fast: false

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Install POLYFLOAT from checkout
        run: |
          mkdir build && cd build
          cmake -G Ninja .. -DPOLYFLOAT_BUILD_TEST=OFF -DCMAKE_CXX_COMPILER=clang++
          ninja install > /dev/null
      - name: Run Sample CMake
        run: |
          mkdir install && cd install
          cmake ../test/integration/install-test -G Ninja
          ninja && ctest --verbose

  ##################################################################################################
  ## Check install process of POLYFLOAT via CPM
  ##################################################################################################
  cpm:
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    strategy:
      fail-fast: false
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Compile using CPM
        run: |
          git config --global --add safe.directory $PWD
          mkdir install && cd install
          cmake ../test/integration/cpm-test -G Ninja -DGIT_BRANCH=${BRANCH_NAME} -DCMAKE_CXX_COMPILER=clang++ -DPOLYFLOAT_BUILD_TEST=OFF
          ninja && ctest --verbose

  ##################################################################################################
  ## Check install process of POLYFLOAT via FetchContents
  ##################################################################################################
  fetch:
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    strategy:
      fail-fast: false
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Compile using FetchContent
        run: |
          git config --global --add safe.directory  $PWD
          mkdir install && cd install
          cmake ../test/integration/fetch-test -G Ninja -DGIT_BRANCH=${BRANCH_NAME} -DPOLYFLOAT_BUILD_TEST=OFF -DCMAKE_CXX_COMPILER=clang++
          ninja && ctest --verbose

  ##################################################################################################
  ## Check POLYFLOAT multi-architecture setup
  ##################################################################################################
  multi-arch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Prepare POLYFLOAT repository for branch ${{ github.head_ref }}
        run: |
          git config --global --add safe.directory $PWD
          mkdir build && cd build
          cmake .. -G Ninja
          ninja install > /dev/null
      - name: Test POLYFLOAT multi-architecture support
        run: |
          mkdir multi-test && cd multi-test
          cmake ../examples/multi-arch -G Ninja
          ninja multi-arch
          ./multi-arch
