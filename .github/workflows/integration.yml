name: POLYFLOAT Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: polyfloat-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      project: polyfloat
      cxx-compiler: g++-15
