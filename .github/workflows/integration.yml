name: POLYFLOAT Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: polyfloat-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:

  install:
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    strategy:
      fail-fast: false

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v3
      - name: Install POLYFLOAT from checkout
        run: |
          mkdir build && cd build
          cmake -G Ninja .. -DPOLYFLOAT_BUILD_TEST=OFF
          ninja install
      - name: Run Sample CMake
        run: |
          mkdir install && cd install
          cmake ../test/integration/install-test -G Ninja -DCMAKE_CXX_COMPILER=g++-15
          ninja test_polyfloat && ctest -R ^test_polyfloat* --verbose

  fetch-content:
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    strategy:
      fail-fast: false

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v3
      - name: Run Sample CMake
        run: |
          git config --global --add safe.directory /__w/polyfloat/polyfloat
          mkdir install && cd install
          cmake ../test/integration/fetch-test -G Ninja  -DCMAKE_CXX_COMPILER=g++-15 -DGIT_BRANCH=${BRANCH_NAME} -DPOLYFLOAT_BUILD_TEST=OFF
          ninja test_polyfloat && ctest -R ^test_polyfloat* --verbose

  cpm:
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    strategy:
      fail-fast: false

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v3
      - name: Run Sample CMake
        run: |
          git config --global --add safe.directory /__w/polyfloat/polyfloat
          mkdir install && cd install
          cmake ../test/integration/cpm-test -G Ninja -DGIT_BRANCH=${BRANCH_NAME}  -DCMAKE_CXX_COMPILER=g++-15
          ninja test_polyfloat && ctest -R ^test_polyfloat* --verbose
